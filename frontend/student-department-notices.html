<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Department Notices - Digital Notice Board</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="dashboard-wrapper">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-text">
        <div class="title">Digital Notice Board</div>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="student-dashboard.html"><i class="fa-solid fa-house icon"></i> Dashboard</a></li>
        <li><a href="student-notices.html"><i class="fa-solid fa-bullhorn icon"></i> General Notices</a></li>
        <li><a href="student-department-notices.html" class="active"><i class="fa-solid fa-building-columns icon"></i> Department Notices</a></li>
        <li><a href="student-search.html"><i class="fa-solid fa-magnifying-glass icon"></i> Search Notice</a></li>
        <li><a href="student-bookmarks.html"><i class="fa-solid fa-bookmark icon"></i> My Bookmarks</a></li>
        <li><a href="student-profile.html"><i class="fa-solid fa-user icon"></i> Profile</a></li>
        <li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket icon"></i> Logout</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer-note">
      <i class="fa-solid fa-shield-halved"></i>
      <span>You can only view notices for your own department.</span>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="main-content">

    <div class="topbar">
      <div>
        <h1><span id="deptTitleName">Department</span> Notices</h1>
        <p class="welcome-sub">Notices specific to your department.</p>
      </div>
      <div class="topbar-right">
        <div class="notif-bell"><i class="fa-solid fa-bell"></i></div>
        <div class="avatar-circle" id="avatarInitial">S</div>
      </div>
    </div>

    <!-- ---------- Notices table ---------- -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="deptNoticesBody">
          <tr>
            <td colspan="4" class="empty-state">Loading notices...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<script src="js/script.js"></script>
<script src="js/student.js"></script>
</body>
</html>
